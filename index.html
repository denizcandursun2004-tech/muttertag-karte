<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Anneler Günü’n Kutlu Olsun ❤️</title>
 
  <!-- WhatsApp / Sosyal Medya Link Önizlemesi -->
  <meta property="og:title" content="Anneler Günü’n Kutlu Olsun ❤️">
  <meta property="og:description" content="Oğlundan küçük ama kalpten bir kart 💐">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://DEINNAME.github.io/muttertag-karte/">
  <meta property="og:image" content="https://DEINNAME.github.io/muttertag-karte/preview.jpg">
 
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ffe6ea, #fff5f7);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
 
    /* Arka planda uçan kalpler */
    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 20px;
      color: rgba(214, 51, 108, 0.4);
      animation: floatUp 8s linear infinite;
    }
    .heart:nth-child(1) { left: 15%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 35%; animation-delay: 2s; }
    .heart:nth-child(3) { left: 55%; animation-delay: 4s; }
    .heart:nth-child(4) { left: 75%; animation-delay: 1s; }
 
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }
 
    .card {
      background: white;
      padding: 26px;
      max-width: 420px;
      text-align: center;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      position: relative;
      z-index: 2;
    }
 
    h1 {
      color: #d6336c;
      margin-bottom: 16px;
    }
 
    p {
      font-size: 17px;
      line-height: 1.6;
    }
 
    /* Nabız atan kalp */
    .pulse {
      display: inline-block;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
 
    .signature {
      margin-top: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
 
  <!-- Arka plan kalpleri -->
  <div class="heart">❤️</div>
  <div class="heart">💗</div>
  <div class="heart">💖</div>
  <div class="heart">❤️</div>
 
  <div class="card">
    <h1>💐 Anneler Günü’n Kutlu Olsun 💐</h1>
 
    <p>
      😜 <strong>Annem,</strong> 😜<br>
      sen olmasaydın<br>
      ne yemeğim olurdu,<br>
      ne temiz kıyafetlerim,<br>
      ne de hayatım bu kadar düzenli olurdu.
    </p>
 
    <p>Her şey için teşekkür ederim 💕</p>
 
    <p class="signature">
      <span class="pulse">❤️</span>
      Oğlun Denizcan Dursun
      <span class="pulse">❤️</span>
    </p>
  </div>
 
</body>
</html>
