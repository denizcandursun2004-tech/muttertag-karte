<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Muttertagskarte</title>

  <!-- Vorschau für WhatsApp -->
  <meta property="og:title" content="Alles Liebe zum Muttertag ❤️">
  <meta property="og:description" content="Eine kleine Karte von deinem Sohn 💐">
  <meta property="og:type" content="website">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ffe6ea, #fff5f7);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 26px;
      max-width: 420px;
      text-align: center;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    h1 {
      color: #d6336c;
      margin-bottom: 16px;
    }
    p {
      font-size: 17px;
      line-height: 1.6;
    }
    .signature {
      margin-top: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💐 Alles Liebe zum Muttertag 💐</h1>

    <p>
      😜 <strong>Mama,</strong> 😜<br>
      ohne dich hätte ich<br>
      kein Essen,<br>
      keine sauberen Klamotten<br>
      und wahrscheinlich viel mehr Chaos im Leben.
    </p>

    <p>Danke &amp; Happy Muttertag!</p>

    <p class="signature">❤️ Dein Sohn ❤️</p>
  </div>

</body>
</html>
